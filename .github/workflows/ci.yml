name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apxchol:
    # The pinned apxchol revision's own suite, on the compilers the package
    # supports on Linux.
    name: apxchol at the pin (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: GCC 14, cc: gcc-14, cxx: g++-14, packages: g++-14 }
          - { name: Clang 18, cc: clang-18, cxx: clang++-18, packages: clang-18 libomp-18-dev }
    steps:
      - uses: actions/checkout@v4
      - name: Read the pin
        id: pin
        run: |
          echo "repository=$(sed -n 's|^repository=https://github.com/||p' deps/apxchol.pin | sed 's|\.git$||')" >> "$GITHUB_OUTPUT"
          echo "revision=$(sed -n 's/^revision=//p' deps/apxchol.pin)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.revision }}
          path: apxchol
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ${{ matrix.packages }} libeigen3-dev ninja-build
      - name: Build and test
        run: |
          cmake -S apxchol -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          cmake --build build -j"$(nproc)"
          ctest --test-dir build --output-on-failure

  test:
    name: Julia ${{ matrix.julia }} (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, julia: '1.10', compiler: clang++-18, packages: clang-18 }
          - { os: ubuntu-latest, julia: '1', compiler: clang++-18, packages: clang-18 }
          - { os: ubuntu-latest, julia: '1', compiler: g++-14, packages: g++-14 }
          - { os: macos-15, julia: '1.10', compiler: AppleClang }
          - { os: macos-latest, julia: '1', compiler: AppleClang }
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - name: Install the Linux compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ${{ matrix.packages }}
          echo "CXX=${{ matrix.compiler }}" >> "$GITHUB_ENV"
      - uses: julia-actions/cache@v2
      - name: Instantiate and build
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.build(verbose=true)'
      - name: Build configuration
        run: |
          cat deps/usr/build_info.txt
          julia --project=. -e 'using ApxChol; println("version=", ApxChol.version(), " metal=", ApxChol.backend_available(:metal))'
      - name: Test
        run: julia --project=. --threads=4 -e 'using Pkg; Pkg.test()'
      - name: Test the Metal backend under Metal's validation layers
        if: runner.os == 'macOS'
        env:
          MTL_DEBUG_LAYER: '1'
          MTL_SHADER_VALIDATION: '1'
        run: |
          if julia --project=. -e 'using ApxChol; exit(ApxChol.backend_available(:metal) ? 0 : 1)'; then
            julia --project=. --threads=4 -e 'using Pkg; Pkg.test()'
          else
            echo "::warning::No usable Metal device on this runner; the Metal tests did not run"
          fi
      - name: Check linkage (exactly one OpenMP runtime, the JLL's)
        shell: bash
        run: |
          lib=$(ls deps/usr/lib/libapxchol.*)
          if [ "$RUNNER_OS" = macOS ]; then deps=$(otool -L "$lib"); else deps=$(readelf -d "$lib"); fi
          echo "$deps"
          [ "$(echo "$deps" | grep -ciE 'lib(g|i)?omp')" = 1 ] || { echo "expected one OpenMP library"; exit 1; }
          ! echo "$deps" | grep -qi gomp
          if [ "$RUNNER_OS" = macOS ]; then echo "$deps" | grep -q Metal.framework; fi
      - name: Run the 9,241-bus regression
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/case9241pegase.m" \
            https://raw.githubusercontent.com/MATPOWER/matpower/2e0ef79a6c4526858ee923491d92781ad4507fb7/data/case9241pegase.m
          julia --project=. test/regression_case9241pegase.jl "$RUNNER_TEMP/case9241pegase.m"
