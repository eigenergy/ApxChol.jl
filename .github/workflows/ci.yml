name: ci

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  apxchol:
    name: apxchol (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 14
            cc: gcc-14
            cxx: g++-14
          - name: Clang 18
            cc: clang-18
            cxx: clang++-18
    steps:
      - uses: actions/checkout@v4
        with:
          repository: samtalki/apxchol
          ref: 4c485af1c6f51825fd9064581dcd124d968c79e3
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++-14 clang-18 libeigen3-dev \
                                  libomp-18-dev ninja-build
      - name: Build and test
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER=${{ matrix.cc }} \
                -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          cmake --build build -j"$(nproc)"
          ctest --test-dir build --output-on-failure

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - name: Install Linux compiler and Eigen
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 cmake libeigen3-dev
          echo "CXX=clang++-18" >> "$GITHUB_ENV"
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake eigen
      - uses: julia-actions/cache@v2
      - name: Instantiate and build
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.build()'
      - name: Test
        run: julia --project=. -e 'using Pkg; Pkg.test()'
      - name: Run 9,241 bus regression
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/case9241pegase.m" \
            https://raw.githubusercontent.com/MATPOWER/matpower/2e0ef79a6c4526858ee923491d92781ad4507fb7/data/case9241pegase.m
          julia --project=. test/regression_case9241pegase.jl \
            "$RUNNER_TEMP/case9241pegase.m"
      - name: Check OpenMP runtime
        run: |
          julia --project=. -e '
            using ApproxCholesky, Libdl
            runtimes = filter(Libdl.dllist()) do path
                name = lowercase(basename(path))
                occursin("libomp", name) || occursin("libgomp", name)
            end
            unique_runtimes = unique(realpath.(runtimes))
            println.(unique_runtimes)
            length(unique_runtimes) == 1 ||
                error("expected one OpenMP runtime, found " * string(length(unique_runtimes)))
          '
